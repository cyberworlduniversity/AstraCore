name: AstraCore tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Validate Python extractor
        run: python -m py_compile scripts/document_extract.py
      - name: Run Python extractor tests
        run: python -m pytest -q tests/test_document_extract.py
      - name: Run Node tests
        run: npm test
      - name: Validate server syntax
        run: node --check server/server.js
