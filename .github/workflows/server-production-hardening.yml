name: AstraCore server production hardening

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[server-hardening-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsafe server bootstrap fallback and generated bytecode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('server/server.js')
          s = p.read_text()
          changed = False
          s2 = re.sub(r"const DEFAULT_CHECKPOINT='data/checkpoints/astracore-demo\.json';", "const DEFAULT_CHECKPOINT='';", s)
          changed |= s2 != s
          s = s2
          s2 = re.sub(r"const BOOTSTRAP_CORPUS=`.*?`;\nfunction bootstrapEngine\(\).*?\n", "", s, flags=re.S)
          changed |= s2 != s
          s = s2
          s2 = s.replace("try{await access(config.checkpoint);engines[id]=await loadCheckpoint(config.checkpoint,{Model:NeuralLanguageModel,Tokenizer:CharacterTokenizer,requireProductionReady:true})}", "try{if(!config.checkpoint)throw new Error('No production checkpoint configured');await access(config.checkpoint);engines[id]=await loadCheckpoint(config.checkpoint,{Model:NeuralLanguageModel,Tokenizer:CharacterTokenizer,requireProductionReady:true})}")
          changed |= s2 != s
          s = s2
          if 'bootstrapEngine' in s or 'BOOTSTRAP_CORPUS' in s:
              raise SystemExit('unsafe bootstrap fallback remains in server/server.js')
          p.write_text(s)
          for root in ('model','scripts','tests'):
              for f in Path(root).rglob('__pycache__/*.pyc'):
                  f.unlink()
                  changed = True
          if not changed:
              print('No server hardening change required')
          PY
          git rm -r --ignore-unmatch model/__pycache__ scripts/__pycache__ tests/__pycache__ || true
      - name: Verify no unsafe production fallback remains
        run: |
          ! grep -R -n -E 'bootstrapEngine|BOOTSTRAP_CORPUS|bootstrap.*model|tiny.*model|demo.*model' server api src --exclude-dir=node_modules
          node --check server/server.js
          node --check 'api/[...path].js'
      - name: Commit hardening
        run: |
          git config user.name 'AstraCore Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: harden server production model gate and remove generated bytecode [server-hardening-complete]'
          git push
