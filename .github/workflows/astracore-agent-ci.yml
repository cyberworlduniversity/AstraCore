name: AstraCore Agent Branch CI

on:
  push:
    branches:
      - feat/agent-modules-audit-2026-11-05
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'tests/**'
      - 'model/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/astracore-agent-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'tests/**'
      - 'model/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/astracore-agent-ci.yml'

permissions:
  contents: read


jobs:
  node-tests:
    name: Node.js 24 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node test suite
        run: npm test
      - name: Check server and API syntax
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/production-routes.js
          node --check api/[...path].js

  python-tests:
    name: Python model and document tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q tests/test_*.py
