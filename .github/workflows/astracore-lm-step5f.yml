name: AstraCoreLM Step 5F Execution Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astracore-lm-step5f.yml'
      - 'model/config_v02.py'
      - 'model/model_v02.py'
      - 'model/tokenizer.py'
      - 'scripts/train_lm_v02.py'
      - 'scripts/evaluate_lm_v02.py'
      - 'scripts/prepare_lm_dataset_v02.py'
      - 'tests/astracorelm_step5_test.py'

concurrency:
  group: astracorelm-step5f-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Step 5F Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: STEP5F preflight
        shell: bash
        run: |
          set -euo pipefail
          echo STEP5F_PREFLIGHT_START
          test "${GITHUB_REPOSITORY}" = "cyberworlduniversity/AstraCore"
          test "${GITHUB_REF_NAME}" = "main"
          for f in model/config_v02.py model/model_v02.py model/tokenizer.py scripts/prepare_lm_dataset_v02.py scripts/train_lm_v02.py scripts/evaluate_lm_v02.py tests/astracorelm_step5_test.py scripts/verify_step5d_runtime.py scripts/write_step5_reports.py requirements.txt .github/workflows/astracore-lm-step5.yml; do
            test -f "$f" || { echo "MISSING_REQUIRED_FILE=$f"; exit 1; }
          done
          grep -Eq '^  workflow_dispatch:' .github/workflows/astracore-lm-step5.yml
          grep -q 'STEP5D_TRAINING_START' .github/workflows/astracore-lm-step5.yml
          grep -q 'STEP5D_ARTIFACT_START' .github/workflows/astracore-lm-step5.yml
          grep -q '^torch>=2.2,<3$' requirements.txt
          grep -q '^numpy>=1.26,<3$' requirements.txt
          grep -q '^pytest>=8,<9$' requirements.txt
          python -m py_compile model/config_v02.py model/model_v02.py model/tokenizer.py scripts/prepare_lm_dataset_v02.py scripts/train_lm_v02.py scripts/evaluate_lm_v02.py
          echo "required_files=PASS"
          echo "workflow_dispatch=PASS"
          echo "step5d_instrumentation=PASS"
          echo "dependency_constraints=PASS"
          echo "python_syntax=PASS"
          echo STEP5F_PREFLIGHT_COMPLETE

  train:
    name: AstraCoreLM v0.2 Controlled Execution
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Initialize evidence state
        run: |
          set -euo pipefail
          rm -rf datasets/astracore-lm-v0.2 artifacts/astracore-lm-v0.2 step5f-evidence step5f-evidence.tar.gz step5f-evidence.sha256
          python - <<'PY'
          import json, os, platform, sys, time
          from pathlib import Path
          manifest={'workflow':'AstraCoreLM Step 5F Execution Recovery','source_workflow':'AstraCoreLM Step 5 Retraining','run_id':os.environ['GITHUB_RUN_ID'],'workflow_run':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'event':os.environ['GITHUB_EVENT_NAME'],'commit_sha':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'timestamp':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'python_version':sys.version.split()[0],'pytorch_version':'NOT_VERIFIED','numpy_version':'NOT_VERIFIED','runner':platform.platform(),'production_approved':False,'production_gate':'CLOSED','status':'RUNNING'}
          assert manifest['event'] in ('workflow_dispatch','push')
          state={k:'NOT_RUN' for k in ('tests','dataset','training','checkpoint','reload','evaluation','behavioral_evaluation','runtime','artifact')}
          Path('step5-run-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('step5-stage-status.json').write_text(json.dumps(state,indent=2)+'\n')
          print('STEP5F_RUN_START')
      - name: Install dependencies and record versions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import json, pathlib, sys, torch, numpy
          p=pathlib.Path('step5-run-manifest.json'); m=json.loads(p.read_text()); m.update({'python_version':sys.version.split()[0],'pytorch_version':torch.__version__,'numpy_version':numpy.__version__,'cuda_available':bool(torch.cuda.is_available())}); p.write_text(json.dumps(m,indent=2)+'\n')
          print('Python='+sys.version.split()[0]); print('PyTorch='+torch.__version__); print('NumPy='+numpy.__version__); print('CUDA_available='+str(torch.cuda.is_available()))
          PY
      - name: Node test suite
        id: node_tests
        continue-on-error: true
        run: npm test
      - name: Python complete test suite
        id: python_tests
        continue-on-error: true
        run: python -m pytest -q
      - name: Record test outcome
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node_tests.outcome }}
          PYTHON_OUTCOME: ${{ steps.python_tests.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('step5-stage-status.json'); s=json.loads(p.read_text()); s['tests']='PASS' if os.environ['NODE_OUTCOME']=='success' and os.environ['PYTHON_OUTCOME']=='success' else 'FAILED'; p.write_text(json.dumps(s,indent=2)+'\n')
          m=Path('step5-run-manifest.json'); d=json.loads(m.read_text()); d['node_tests_outcome']=os.environ['NODE_OUTCOME']; d['python_tests_outcome']=os.environ['PYTHON_OUTCOME']; m.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Verify v0.2 configuration
        run: |
          set -euo pipefail
          python - <<'PY'
          from model.config_v02 import ModelConfigV02
          cfg=ModelConfigV02(vocab_size=2048)
          expected={'architecture_version':'astracorelm-arch-v0.2','context_length':128,'embedding_dim':256,'layers':4,'heads':8,'ffn_dim':1024,'normalization':'LayerNorm-pre-norm','position_encoding':'learned-absolute','weight_tying':True,'tokenizer_version':'astratokenizer-v0.1','max_raw_input_tokens':126,'special_token_overhead':2,'max_encoded_sequence_length':128,'batch_size':16,'epochs':8,'learning_rate':0.0003,'weight_decay':0.01,'seed':42}
          actual={'architecture_version':cfg.architecture_version,'context_length':cfg.context_length,'embedding_dim':cfg.embedding_dimension,'layers':cfg.number_of_layers,'heads':cfg.attention_heads,'ffn_dim':cfg.feed_forward_dimension,'normalization':cfg.normalization,'position_encoding':cfg.positional_encoding,'weight_tying':cfg.weight_tying,'tokenizer_version':cfg.tokenizer_version,'max_raw_input_tokens':cfg.max_raw_input_tokens,'special_token_overhead':cfg.special_token_overhead,'max_encoded_sequence_length':cfg.max_encoded_sequence_length,'batch_size':16,'epochs':8,'learning_rate':0.0003,'weight_decay':0.01,'seed':42}
          assert actual==expected,(actual,expected)
          print(actual)
          PY
      - name: STEP5F dataset preparation and verification
        id: dataset
        run: |
          set -euo pipefail
          echo STEP5F_DATASET_START
          python scripts/prepare_lm_dataset_v02.py --output datasets/astracore-lm-v0.2 --seed 42
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('datasets/astracore-lm-v0.2'); meta=json.loads((root/'metadata.json').read_text()); rows=[json.loads(x) for x in (root/'records.jsonl').read_text().splitlines() if x.strip()]
          assert meta['dataset_id']=='astracore-lm-v0.2' and meta['dataset_version']=='0.2.0' and meta['generation_seed']==42
          assert (meta['record_count'],meta['train_count'],meta['validation_count'],meta['test_count'])==(1648,1280,160,208)
          digest=hashlib.sha256((root/'records.jsonl').read_bytes()).hexdigest(); assert digest==meta['dataset_sha256']
          ids={s:{r['document_id'] for r in rows if r['split']==s} for s in ('train','validation','test')}; assert not (ids['train']&ids['validation'] or ids['train']&ids['test'] or ids['validation']&ids['test'])
          p=Path('step5-stage-status.json'); st=json.loads(p.read_text()); st['dataset']='PASS'; p.write_text(json.dumps(st,indent=2)+'\n')
          m=Path('step5-run-manifest.json'); d=json.loads(m.read_text()); d.update({'dataset_id':meta['dataset_id'],'dataset_version':meta['dataset_version'],'dataset_sha256':digest,'record_count':len(rows),'train_count':meta['train_count'],'validation_count':meta['validation_count'],'test_count':meta['test_count'],'seed':meta['generation_seed']}); m.write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps(meta,indent=2)); print('STEP5F_DATASET_COMPLETE')
          PY
      - name: STEP5F training
        id: training
        run: |
          set -euo pipefail
          echo STEP5F_TRAINING_START
          python scripts/train_lm_v02.py --dataset datasets/astracore-lm-v0.2 --output artifacts/astracore-lm-v0.2 --context-length 128 --embedding-dimension 256 --layers 4 --heads 8 --ffn 1024 --epochs 8 --batch-size 16 --lr 3e-4 --weight-decay 0.01 --seed 42
          python - <<'PY'
          import json, math
          from pathlib import Path
          s=json.loads(Path('artifacts/astracore-lm-v0.2/training_state.json').read_text()); assert s['optimizer_steps']>0; assert s['epochs_completed']==8; assert s['initial_parameter_sha256']!=s['trained_parameter_sha256']; assert s['weights_changed'] is True; assert len(s['history'])==8
          for epoch,row in enumerate(s['history'],1):
            assert row['epoch']==epoch
            for k in ('train_loss','validation_loss','validation_ppl'): assert math.isfinite(float(row[k]))
            assert math.isclose(float(row['validation_ppl']),math.exp(float(row['validation_loss'])),rel_tol=1e-10,abs_tol=1e-10)
          p=Path('step5-stage-status.json'); st=json.loads(p.read_text()); st['training']='PASS'; p.write_text(json.dumps(st,indent=2)+'\n')
          p=Path('step5-run-manifest.json'); m=json.loads(p.read_text()); m.update({'architecture_version':s['architecture_version'],'architecture_sha256':s['config_sha256'],'tokenizer_sha256':s['tokenizer_sha256'],'vocab_size':s['vocab_size'],'parameter_count':s['parameter_count'],'initial_parameter_sha256':s['initial_parameter_sha256'],'trained_parameter_sha256':s['trained_parameter_sha256'],'weights_changed':s['weights_changed'],'optimizer_steps':s['optimizer_steps'],'epochs_requested':s['epochs'],'epochs_completed':s['epochs_completed'],'best_epoch':s['best_epoch'],'batch_size':s['batch_size'],'learning_rate':s['learning_rate'],'weight_decay':s['weight_decay'],'training_seed':s['seed'],'epoch_metrics':s['history'],'best_validation_loss':s['best_validation_loss'],'best_validation_ppl':s['best_validation_ppl']}); p.write_text(json.dumps(m,indent=2)+'\n')
          print('OPTIMIZER_STEPS='+str(s['optimizer_steps'])); print('INITIAL_PARAMETER_SHA256='+s['initial_parameter_sha256']); print('TRAINED_PARAMETER_SHA256='+s['trained_parameter_sha256']); print('WEIGHTS_CHANGED=true'); print('STEP5F_TRAINING_COMPLETE')
          PY
      - name: STEP5F checkpoint integrity
        id: checkpoint
        run: |
          set -euo pipefail
          test -s artifacts/astracore-lm-v0.2/checkpoint.pt
          sha256sum artifacts/astracore-lm-v0.2/checkpoint.pt | tee artifacts/astracore-lm-v0.2/checkpoint.sha256
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('artifacts/astracore-lm-v0.2'); ck=root/'checkpoint.pt'; state=json.loads((root/'training_state.json').read_text()); digest=hashlib.sha256(ck.read_bytes()).hexdigest(); assert digest==state['checkpoint_sha256']; assert ck.stat().st_size>0
          p=Path('step5-stage-status.json'); st=json.loads(p.read_text()); st['checkpoint']='PASS'; p.write_text(json.dumps(st,indent=2)+'\n')
          p=Path('step5-run-manifest.json'); m=json.loads(p.read_text()); m.update({'checkpoint_path':str(ck),'checkpoint_sha256':digest,'checkpoint_size_bytes':ck.stat().st_size}); p.write_text(json.dumps(m,indent=2)+'\n'); print('STEP5F_CHECKPOINT_COMPLETE')
          PY
      - name: STEP5F fresh-process reload
        id: reload
        run: |
          set -euo pipefail
          python scripts/verify_step5d_runtime.py --checkpoint-dir artifacts/astracore-lm-v0.2 --output artifacts/astracore-lm-v0.2/runtime_verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/astracore-lm-v0.2/runtime_verification.json').read_text()); assert r['reload_pass'] is True; assert r['architecture_version']=='astracorelm-arch-v0.2'; assert r['tokenizer_version']=='astratokenizer-v0.1'; assert r['over_limit_behavior']=='REJECTED'
          p=Path('step5-stage-status.json'); s=json.loads(p.read_text()); s['reload']='PASS'; p.write_text(json.dumps(s,indent=2)+'\n'); print(json.dumps(r,indent=2))
          PY
      - name: STEP5F independent evaluation
        id: evaluation
        run: |
          set -euo pipefail
          python scripts/evaluate_lm_v02.py --dataset datasets/astracore-lm-v0.2 --checkpoint artifacts/astracore-lm-v0.2
          python - <<'PY'
          import json, math
          from pathlib import Path
          e=json.loads(Path('artifacts/astracore-lm-v0.2/test_evaluation.json').read_text()); assert math.isclose(e['validation_ppl'],math.exp(e['validation_loss']),rel_tol=1e-10); assert math.isclose(e['test_ppl'],math.exp(e['test_loss']),rel_tol=1e-10)
          p=Path('step5-stage-status.json'); st=json.loads(p.read_text()); st['evaluation']='PASS'; p.write_text(json.dumps(st,indent=2)+'\n'); print(json.dumps(e,indent=2))
          PY
      - name: STEP5F behavioral evaluation
        id: behavioral
        run: |
          set -euo pipefail
          test -s artifacts/astracore-lm-v0.2/behavioral_evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/astracore-lm-v0.2/behavioral_evaluation.json').read_text()); required=('instruction_following','structured_output','context_grounding','unknown_information','basic_reasoning','language_handling','prompt_injection','repetition_degeneracy','longer_context'); assert all(k in r['behavioral_summary'] for k in required); assert r['production_approved'] is False
          p=Path('step5-stage-status.json'); s=json.loads(p.read_text()); s['behavioral_evaluation']='PASS'; p.write_text(json.dumps(s,indent=2)+'\n'); print(json.dumps(r['behavioral_summary'],indent=2,ensure_ascii=False))
          PY
      - name: STEP5F runtime measurement
        id: runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/astracore-lm-v0.2/runtime_verification.json').read_text())
          runtime={k:r.get(k,'NOT_MEASURED') for k in ('model_load_latency_ms','tokenizer_load_ms','first_token_latency_ms','generation_latency_ms','tokens_per_second','peak_ram_mb')}
          Path('artifacts/astracore-lm-v0.2/runtime_measurement.json').write_text(json.dumps(runtime,indent=2)+'\n')
          p=Path('step5-stage-status.json'); s=json.loads(p.read_text()); s['runtime']='MEASURED' if all(v!='NOT_MEASURED' for v in runtime.values()) else 'NOT_MEASURED'; p.write_text(json.dumps(s,indent=2)+'\n'); print(json.dumps(runtime,indent=2))
          PY
      - name: Generate Step 5 reports
        if: always()
        run: |
          set +e
          python scripts/write_step5_reports.py --artifact-dir artifacts/astracore-lm-v0.2 --manifest step5-run-manifest.json
          true
      - name: STEP5F artifact packaging
        if: always()
        run: |
          set -euo pipefail
          mkdir -p step5f-evidence
          cp step5-run-manifest.json step5-stage-status.json step5f-evidence/ 2>/dev/null || true
          cp artifacts/astracore-lm-v0.2/* step5f-evidence/ 2>/dev/null || true
          cp -r datasets/astracore-lm-v0.2 step5f-evidence/dataset 2>/dev/null || true
          sha256sum step5f-evidence/* > step5f-evidence/SHA256SUMS.txt 2>/dev/null || true
          tar -czf step5f-evidence.tar.gz step5f-evidence
          sha256sum step5f-evidence.tar.gz > step5f-evidence.sha256
      - name: Upload Step 5F evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: astracorelm-step5f-evidence-${{ github.run_id }}
          path: |
            step5f-evidence.tar.gz
            step5f-evidence.sha256
          retention-days: 90
      - name: STEP5F final gate
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('step5-stage-status.json').read_text())
          required=('tests','dataset','training','checkpoint','reload','evaluation','behavioral_evaluation')
          assert all(s.get(k)=='PASS' for k in required), s
          assert s.get('runtime') in ('MEASURED','NOT_MEASURED')
          print(json.dumps(s,indent=2))
          PY
          echo STEP5F_RUN_COMPLETE