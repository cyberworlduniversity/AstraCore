name: AstraCoreLM v1.0 Training

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'model/**'
      - 'scripts/generate_lm_dataset.py'
      - 'scripts/train_lm.py'
      - 'requirements.txt'
      - '.github/workflows/astracore-lm-training.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate approved original dataset
        run: python scripts/generate_lm_dataset.py --output datasets/astracore-lm-v1.0 --seed 42
      - name: Validate dataset counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('datasets/astracore-lm-v1.0/metadata.json').read_text())
          assert m['train_count'] >= 1000, m
          assert m['validation_count'] >= 100, m
          assert m['test_count'] >= 100, m
          assert m['license'] == 'CC0-1.0', m
          print(json.dumps(m, indent=2))
          PY
      - name: Train AstraCoreLM v1.0
        run: >-
          python scripts/train_lm.py
          --corpus datasets/astracore-lm-v1.0
          --output artifacts/astracore-lm-v1.0
          --vocab-size 4096
          --context-length 128
          --embedding-dimension 128
          --layers 4
          --heads 4
          --epochs 5
          --batch-size 8
          --lr 3e-4
          --seed 42
      - name: Evaluate held-out validation and test evidence
        run: |
          cat artifacts/astracore-lm-v1.0/test_evaluation.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          state=json.loads(Path('artifacts/astracore-lm-v1.0/training_state.json').read_text())
          ev=json.loads(Path('artifacts/astracore-lm-v1.0/test_evaluation.json').read_text())
          assert state['status']=='trained', state
          assert state['dataset']['validation_documents'] >= 100, state
          assert math.isfinite(ev['validation_perplexity']), ev
          assert math.isfinite(ev['test_perplexity']), ev
          print('AstraCoreLM v1.0 evidence gate: PASS')
          PY
      - name: Verify checkpoint artifacts
        run: |
          test -s artifacts/astracore-lm-v1.0/model.pt
          test -s artifacts/astracore-lm-v1.0/config.json
          test -s artifacts/astracore-lm-v1.0/tokenizer.json
          test -s artifacts/astracore-lm-v1.0/training_state.json
          test -s artifacts/astracore-lm-v1.0/test_evaluation.json
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: astracore-lm-v1.0-checkpoint
          path: artifacts/astracore-lm-v1.0/
          if-no-files-found: error
          retention-days: 30
