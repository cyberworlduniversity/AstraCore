name: AstraCoreLM v0.1 Training

on:
  push:
    branches: [main]
    paths:
      - 'datasets/astracore-lm-v0.1/**'
      - 'model/**'
      - 'scripts/train_lm.py'
      - 'scripts/evaluate_lm.py'
      - 'requirements.txt'
      - '.github/workflows/astracore-lm-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Train AstraCoreLM v0.1
        run: >-
          python scripts/train_lm.py
          --corpus datasets/astracore-lm-v0.1
          --output artifacts/astracore-lm-v0.1
          --vocab-size 2048
          --context-length 128
          --embedding-dimension 128
          --layers 4
          --heads 4
          --epochs 3
          --batch-size 4
          --lr 3e-4
          --seed 42
      - name: Evaluate checkpoint
        run: |
          python scripts/evaluate_lm.py --checkpoint artifacts/astracore-lm-v0.1 --text datasets/astracore-lm-v0.1/train.txt | tee artifacts/astracore-lm-v0.1/evaluation.json
      - name: Verify checkpoint gate
        run: |
          test -s artifacts/astracore-lm-v0.1/model.pt
          test -s artifacts/astracore-lm-v0.1/config.json
          test -s artifacts/astracore-lm-v0.1/tokenizer.json
          test -s artifacts/astracore-lm-v0.1/training_state.json
          test -s artifacts/astracore-lm-v0.1/corpus_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/astracore-lm-v0.1')
          state=json.loads((root/'training_state.json').read_text())
          evaluation=json.loads((root/'evaluation.json').read_text())
          assert state.get('status') == 'trained', state
          assert evaluation.get('validation_loss') is not None, evaluation
          assert evaluation.get('perplexity') is not None, evaluation
          print('AstraCoreLM checkpoint gate: PASS')
          print(json.dumps(evaluation, indent=2))
          PY
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: astracore-lm-v0.1-checkpoint
          path: artifacts/astracore-lm-v0.1/
          if-no-files-found: error
          retention-days: 30
