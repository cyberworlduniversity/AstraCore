name: AstraCoreEmbed v0.1 Training

on:
  push:
    branches: [main]
    paths:
      - 'datasets/astracore-embed-v0.1-bootstrap.jsonl'
      - 'model/**'
      - 'scripts/train_embeddings.py'
      - 'scripts/evaluate_embeddings.py'
      - 'requirements.txt'
      - '.github/workflows/astracore-embed-training.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate semantic dataset
        run: python scripts/validate_embedding_dataset.py --data datasets/astracore-embed-v0.1-bootstrap.jsonl
      - name: Train AstraCoreEmbed v0.1
        run: >-
          python scripts/train_embeddings.py
          --data datasets/astracore-embed-v0.1-bootstrap.jsonl
          --output artifacts/astracore-embed-v0.1
          --dataset-name astracore-embed-v0.1-bootstrap
          --dataset-version 0.1.0
          --source user_authored_bootstrap
          --license project-authored
          --epochs 5
          --batch-size 8
          --lr 2e-4
          --seed 42
      - name: Evaluate checkpoint
        run: >-
          python scripts/evaluate_embeddings.py
          --checkpoint artifacts/astracore-embed-v0.1
          --data datasets/astracore-embed-v0.1-bootstrap.jsonl
          --validation-ratio 0.2
          --seed 42
          | tee artifacts/astracore-embed-v0.1/evaluation.json
      - name: Verify checkpoint completeness
        run: |
          test -s artifacts/astracore-embed-v0.1/model.pt
          test -s artifacts/astracore-embed-v0.1/config.json
          test -s artifacts/astracore-embed-v0.1/tokenizer.json
          test -s artifacts/astracore-embed-v0.1/training_state.json
          test -s artifacts/astracore-embed-v0.1/dataset_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/astracore-embed-v0.1')
          state = json.loads((root / 'training_state.json').read_text())
          evaluation = json.loads((root / 'evaluation.json').read_text())
          assert state.get('status') == 'trained', state
          assert evaluation.get('pairs', 0) >= 1, evaluation
          assert evaluation.get('embedding_dim') == 384, evaluation
          print('AstraCoreEmbed checkpoint gate: PASS')
          print(json.dumps(evaluation, indent=2))
          PY
      - name: Upload trained checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: astracore-embed-v0.1-checkpoint
          path: artifacts/astracore-embed-v0.1/
          if-no-files-found: error
          retention-days: 30
