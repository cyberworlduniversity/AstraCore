name: AstraCore CI

on:
  push:
    branches: [main, fix/agent-runs-contract]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astracore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astracore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Install Python model dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Node test suite
        run: npm test

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Run durable agent queue PostgreSQL integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d astracore_test -v ON_ERROR_STOP=1 -f tests/postgres/agent-queue.integration.sql

      - name: Compile AstraCoreLM serving modules
        run: python -m py_compile model/serving_v02.py scripts/serve_lm_v02.py

      - name: Syntax check runtime files
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/knowledge-api.js
          node --check server/embedding-service.js
          node --check api/[...path].js
