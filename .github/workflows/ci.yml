name: AstraCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply Steps 12-15 implementation
        if: "!contains(github.event.head_commit.message, '[steps-12-15-complete]')"
        run: |
          if [ -f server/embedding-service.js ]; then
            echo "Steps 12-15 source integration already present"
          else
            python3 scripts/apply_steps_12_15.py
          fi

      - name: Run test suite
        run: npm test

      - name: Syntax check runtime files
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/knowledge-api.js
          node --check server/embedding-service.js
          node --check api/[...path].js

      - name: Commit Steps 12-15 implementation
        if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[steps-12-15-complete]')"
        run: |
          git config user.name "AstraCore Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete steps 12-15 [steps-12-15-complete]"
          git push
