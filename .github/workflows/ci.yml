name: AstraCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI is validation-only. It must never write to the repository.
permissions:
  contents: read

concurrency:
  group: astracore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python model dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Node test suite
        run: npm test

      - name: Run Python test suite
        run: python -m pytest -q tests/test_*.py

      - name: Syntax check runtime files
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/knowledge-api.js
          node --check server/embedding-service.js
          node --check api/[...path].js
