name: AstraCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Python model dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Node test suite
        run: npm test

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Compile AstraCoreLM serving modules
        run: python -m py_compile model/serving_v02.py scripts/serve_lm_v02.py

      - name: Syntax check runtime files
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/knowledge-api.js
          node --check server/embedding-service.js
          node --check api/[...path].js

