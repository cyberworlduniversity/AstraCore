name: Complete AstraCore Steps 12-15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: "!contains(github.event.head_commit.message, '[steps-12-15-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply implementation
        run: node scripts/complete_steps_12_15.mjs
      - name: Run Node tests
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name "AstraCore Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete steps 12-15 [steps-12-15-complete]"
          git push
