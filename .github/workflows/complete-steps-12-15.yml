name: AstraCore Steps 12-15 Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'model/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/complete-steps-12-15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Node tests
        run: npm test
      - name: Verify release gate remains honest
        run: node --input-type=module - <<'NODE'
          import { productionGate } from './src/core/production-gate.js';
          const result = productionGate({
            model: { status: 'untrained' },
            embeddings: { status: 'training' },
            evaluation: { status: 'not_ready' },
          });
          if (result.status !== 'BLOCKED') throw new Error('Production gate must fail closed for untrained components');
          console.log(JSON.stringify(result));
        NODE
