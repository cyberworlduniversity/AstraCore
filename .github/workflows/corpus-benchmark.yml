name: ASTRA corpus download and benchmark

on:
  push:
    paths:
      - '.github/workflows/corpus-benchmark.yml'
      - 'data/**'
      - 'benchmarks/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and dataset reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . datasets
      - name: Stream small Tamil and English starter corpora
        run: |
          python data/download_hf_corpora.py --tamil-max-rows 500 --english-max-rows 500 --quality-min 0.8
      - name: Prepare normalized train and evaluation splits
        run: python data/prepare_corpus.py --max-lines-per-source 500 --eval-percent 10
      - name: Create deterministic small benchmark subset
        run: |
          python - <<'PY'
          from pathlib import Path
          train = [line for line in Path("data/prepared/train.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          evaluation = [line for line in Path("data/prepared/eval.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          if len(train) < 2 or not evaluation:
              raise SystemExit(f"Insufficient prepared data: train={len(train)}, eval={len(evaluation)}")
          Path("data/prepared/smoke-train.txt").write_text("\n".join(train[:100]) + "\n", encoding="utf-8")
          Path("data/prepared/smoke-eval.txt").write_text("\n".join(evaluation[:25]) + "\n", encoding="utf-8")
          print(f"Small benchmark subset: train={min(100, len(train))}, eval={min(25, len(evaluation))}")
          PY
      - name: Benchmark AASTA against byte-BPE (small smoke test)
        run: |
          python benchmarks/compare_tokenizers.py --train-file data/prepared/smoke-train.txt --eval-file data/prepared/smoke-eval.txt --vocab-size 320 --repeats 5 --output benchmarks/corpus-results.json
      - name: Upload corpus manifests and benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: astra-small-corpus-benchmark
          path: |
            data/raw/download_manifest.json
            data/prepared/manifest.json
            benchmarks/corpus-results.json
          if-no-files-found: error
          retention-days: 30
